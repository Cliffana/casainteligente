<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="ggold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- PCB Board -->
  <rect x="20" y="30" width="280" height="200" rx="10" fill="url(#gb)" filter="url(#s)"/>
  <!-- Main chip (BCM2711) -->
  <rect x="105" y="65" width="110" height="60" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#94A3B8">BCM2711</text>
  <text x="160" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#64748B">Cortex-A72</text>
  <text x="160" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#64748B">4GB RAM</text>
  <!-- USB ports -->
  <rect x="25" y="140" width="50" height="14" rx="3" fill="#CBD5E1"/>
  <text x="50" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#475569">USB 3.0</text>
  <rect x="25" y="160" width="50" height="14" rx="3" fill="#CBD5E1"/>
  <text x="50" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#475569">USB 3.0</text>
  <rect x="25" y="180" width="50" height="14" rx="3" fill="#94A3B8"/>
  <text x="50" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="white">USB 2.0</text>
  <rect x="25" y="200" width="50" height="14" rx="3" fill="#94A3B8"/>
  <text x="50" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="white">USB 2.0</text>
  <!-- LAN port -->
  <rect x="245" y="140" width="50" height="20" rx="3" fill="#2563EB"/>
  <text x="270" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="white">Ethernet</text>
  <!-- HDMI ports -->
  <rect x="245" y="175" width="50" height="14" rx="3" fill="#CBD5E1"/>
  <text x="270" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#475569">HDMI</text>
  <!-- GPIO header -->
  <g transform="translate(240,50)">
    <rect x="0" y="0" width="30" height="12" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="15" y="9" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#64748B">GPIO</text>
  </g>
  <!-- Power LED -->
  <circle cx="160" cy="48" r="4" fill="url(#gg)"/>
  <circle cx="175" cy="48" r="3" fill="url(#ggold)"/>
  <!-- SD card -->
  <rect x="130" y="225" width="60" height="15" rx="3" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
  <text x="160" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" font-weight="700" fill="#78350F">microSD</text>
  <!-- WiFI/BT -->
  <text x="275" y="48" font-family="Arial,sans-serif" font-size="7" fill="#94A3B8">📡 WiFi</text>
  <text x="275" y="58" font-family="Arial,sans-serif" font-size="7" fill="#94A3B8">🔵 BLE 5.0</text>
  <!-- Price tag -->
  <rect x="100" y="240" width="120" height="20" rx="10" fill="url(#ggold)"/>
  <text x="160" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#78350F">~50€ | 5W consumo</text>
</svg>
