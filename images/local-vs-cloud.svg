<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="#F8FAFC" rx="12"/>
  <text x="400" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Fluxo de Comando: Local vs Nuvem</text>
  <!-- LEFT: Cloud path -->
  <rect x="25" y="55" width="360" height="350" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  <text x="205" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#DC2626">✘  Google Home / Alexa</text>
  <!-- Cloud steps -->
  <g transform="translate(55,100)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#FEE2E2"/>
    <text x="150" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#991B1B">① Telemóvel diz "Acende a luz"</text>
    <text x="150" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#B91C1C">WiFi → Router</text>
  </g>
  <text x="205" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#EF4444">↓</text>
  <g transform="translate(55,175)">
    <rect x="0" y="0" width="300" height="55" rx="8" fill="#FECACA"/>
    <text x="150" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#991B1B">② Servidores EUA (nuvem)</text>
    <text x="150" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#B91C1C">Router → Internet → Google/AWS</text>
    <text x="150" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#B91C1C">Processamento + 300ms latência</text>
  </g>
  <text x="205" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#EF4444">↓</text>
  <g transform="translate(55,265)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#FEE2E2"/>
    <text x="150" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#991B1B">③ Comando volta para casa</text>
    <text x="150" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#B91C1C">Internet → Router → Lâmpada</text>
  </g>
  <text x="205" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#DC2626">Internet CAI? A lâmpada não acende.</text>

  <!-- RIGHT: Local path -->
  <rect x="415" y="55" width="360" height="350" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
  <text x="595" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#16A34A">✔  Home Assistant</text>
  <g transform="translate(445,100)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#DCFCE7"/>
    <text x="150" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#166534">① Telemóvel diz "Acende a luz"</text>
    <text x="150" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#15803D">WiFi → Router</text>
  </g>
  <text x="595" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#16A34A">↓</text>
  <g transform="translate(445,175)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#BBF7D0"/>
    <text x="150" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#166534">② Raspberry Pi na mesma rede</text>
    <text x="150" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#15803D">Router → Pi (5ms latência)</text>
  </g>
  <text x="595" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#16A34A">↓</text>
  <g transform="translate(445,250)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#DCFCE7"/>
    <text x="150" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#166534">③ Comando direto à lâmpada</text>
    <text x="150" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#15803D">Rede local → Lâmpada (instantâneo)</text>
  </g>
  <text x="595" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#16A34A">Internet CAI? Continua a funcionar.</text>
</svg>
