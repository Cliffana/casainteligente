<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Tablet body -->
  <rect x="30" y="10" width="540" height="400" rx="18" fill="#0F172A" filter="url(#s)"/>
  <rect x="42" y="22" width="516" height="376" rx="12" fill="#1E293B"/>
  <!-- Status bar -->
  <rect x="42" y="22" width="516" height="30" rx="12" fill="#0F172A"/>
  <text x="60" y="42" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8">09:41</text>
  <text x="530" y="42" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8">WiFi  ● 100%</text>
  <!-- Sidebar -->
  <rect x="42" y="52" width="120" height="346" rx="0" fill="#1E293B"/>
  <text x="70" y="82" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#00C6FF">Visão Geral</text>
  <text x="70" y="108" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Quartos</text>
  <text x="70" y="130" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Câmaras</text>
  <text x="70" y="152" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Energia</text>
  <text x="70" y="174" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Automações</text>
  <text x="70" y="196" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Sistema</text>
  <!-- Main content area -->
  <!-- Weather card -->
  <rect x="175" y="62" width="170" height="80" rx="8" fill="#334155"/>
  <text x="185" y="80" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">🌤  Clima</text>
  <text x="185" y="100" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">22°</text>
  <text x="185" y="118" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">Humidade: 62%</text>
  <!-- Temperature card -->
  <rect x="360" y="62" width="185" height="80" rx="8" fill="#334155"/>
  <text x="370" y="80" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">🌡  Temperatura Casa</text>
  <text x="370" y="100" font-family="Arial,sans-serif" font-size="14" fill="white">Sala: 21.5°</text>
  <text x="370" y="118" font-family="Arial,sans-serif" font-size="14" fill="white">Quarto: 19.8°</text>
  <!-- Quick controls -->
  <rect x="175" y="152" width="370" height="50" rx="8" fill="#334155"/>
  <text x="185" y="172" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">⚡  Controlos Rápidos</text>
  <!-- Light buttons -->
  <rect x="185" y="180" width="50" height="18" rx="4" fill="#2563EB"/>
  <text x="210" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="white">Sala</text>
  <rect x="240" y="180" width="50" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="265" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#94A3B8">Cozinha</text>
  <rect x="295" y="180" width="50" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="320" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#94A3B8">Quarto</text>
  <rect x="350" y="180" width="55" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="377" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#94A3B8">Exterior</text>
  <!-- Sensors grid -->
  <rect x="175" y="215" width="120" height="70" rx="8" fill="#334155"/>
  <text x="185" y="233" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">🚪  Portas</text>
  <text x="185" y="253" font-family="Arial,sans-serif" font-size="11" fill="#16A34A">● Entrada: Fechada</text>
  <text x="185" y="270" font-family="Arial,sans-serif" font-size="11" fill="#16A34A">● Garagem: Fechada</text>
  <rect x="310" y="215" width="120" height="70" rx="8" fill="#334155"/>
  <text x="320" y="233" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">📷  Câmaras</text>
  <text x="320" y="253" font-family="Arial,sans-serif" font-size="11" fill="#FBBF24">● Sala: Live</text>
  <text x="320" y="270" font-family="Arial,sans-serif" font-size="11" fill="#FBBF24">● Exterior: Live</text>
  <!-- Energy card -->
  <rect x="175" y="298" width="370" height="65" rx="8" fill="#334155"/>
  <text x="185" y="316" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">🔋  Energia (hoje)</text>
  <text x="185" y="338" font-family="Arial,sans-serif" font-size="11" fill="white">Consumo: 2.4 kWh</text>
  <text x="185" y="354" font-family="Arial,sans-serif" font-size="11" fill="white">Produção Solar: 1.8 kWh  </text>
  <text x="480" y="338" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#16A34A">● 0.44€</text>
  <!-- Bottom nav -->
  <rect x="42" y="375" width="516" height="23" rx="0" fill="#0F172A"/>
  <text x="300" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Início  •  Dispositivos  •  Automations  •  Configurações</text>
</svg>
