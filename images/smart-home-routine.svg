<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#161C46"/>
      <stop offset="55%" stop-color="#0E1230"/>
      <stop offset="100%" stop-color="#070914"/>
    </radialGradient>

    <linearGradient id="trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>

    <linearGradient id="houseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2050"/>
      <stop offset="100%" stop-color="#10132C"/>
    </linearGradient>

    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD08A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFB84D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8CF7FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="strongBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- ambient bokeh particles -->
  <g opacity="0.5">
    <circle cx="120" cy="90" r="2.5" fill="#8CF7FF"/>
    <circle cx="220" cy="150" r="1.6" fill="#FFB84D"/>
    <circle cx="1000" cy="80" r="2" fill="#7C5CFC"/>
    <circle cx="1080" cy="200" r="1.8" fill="#00E5FF"/>
    <circle cx="60" cy="450" r="2" fill="#7C5CFC"/>
    <circle cx="140" cy="520" r="1.6" fill="#FFB84D"/>
    <circle cx="950" cy="520" r="2.2" fill="#8CF7FF"/>
    <circle cx="1050" cy="440" r="1.6" fill="#FFB84D"/>
  </g>

  <!-- distant skyline silhouettes for depth -->
  <g fill="#12163A" opacity="0.6">
    <rect x="0" y="470" width="70" height="158"/>
    <rect x="80" y="500" width="50" height="128"/>
    <rect x="1080" y="480" width="60" height="148"/>
    <rect x="1140" y="510" width="60" height="118"/>
  </g>

  <!-- ===== HOUSE CUTAWAY (right side) ===== -->
  <g transform="translate(620,90)">
    <!-- roof -->
    <polygon points="0,90 230,0 460,90" fill="#0C0E24"/>
    <!-- main house body -->
    <rect x="20" y="90" width="420" height="380" rx="10" fill="url(#houseFill)" stroke="#2A3170" stroke-width="2"/>

    <!-- floor divider -->
    <line x1="20" y1="280" x2="440" y2="280" stroke="#2A3170" stroke-width="2"/>
    <!-- room dividers -->
    <line x1="230" y1="90" x2="230" y2="470" stroke="#2A3170" stroke-width="2"/>

    <!-- ROOM 1 (top-left) window: lamp - dim, not yet triggered -->
    <rect x="55" y="120" width="140" height="120" rx="6" fill="#161B44" stroke="#333B7C" stroke-width="1.5"/>
    <!-- ROOM 2 (top-right) window: thermostat - triggered, glowing amber -->
    <rect x="265" y="120" width="140" height="120" rx="6" fill="#3A2A16" stroke="#FFB84D" stroke-width="2"/>
    <circle cx="335" cy="180" r="34" fill="none" stroke="#FFD08A" stroke-width="5"/>
    <circle cx="335" cy="180" r="34" fill="url(#warmGlow)" filter="url(#softBlur)"/>
    <path d="M335,150 A30,30 0 0,1 362,196" fill="none" stroke="#FFD08A" stroke-width="5" stroke-linecap="round"/>

    <!-- ROOM 3 (bottom-left) window: smart lock - triggered, glowing cyan -->
    <rect x="55" y="310" width="140" height="120" rx="6" fill="#14313A" stroke="#00E5FF" stroke-width="2"/>
    <rect x="105" y="345" width="40" height="52" rx="8" fill="none" stroke="#8CF7FF" stroke-width="5"/>
    <circle cx="125" cy="345" r="16" fill="none" stroke="#8CF7FF" stroke-width="5"/>
    <circle cx="125" cy="371" r="6" fill="#8CF7FF"/>
    <circle cx="125" cy="371" r="30" fill="url(#cyanGlow)" filter="url(#softBlur)"/>

    <!-- ROOM 4 (bottom-right) window: speaker/sound waves - about to trigger, violet -->
    <rect x="265" y="310" width="140" height="120" rx="6" fill="#241C42" stroke="#7C5CFC" stroke-width="2"/>
    <rect x="318" y="350" width="20" height="40" rx="4" fill="#B9A6FF"/>
    <path d="M348,352 a26,26 0 0 1 0,36" fill="none" stroke="#B9A6FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M360,344 a42,42 0 0 1 0,52" fill="none" stroke="#B9A6FF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- front door -->
    <rect x="195" y="380" width="70" height="90" rx="4" fill="#0C0E24" stroke="#2A3170" stroke-width="2"/>
    <circle cx="248" cy="428" r="3.5" fill="#5A63B0"/>
  </g>

  <!-- ===== ENERGY TRAIL: phone -> devices (domino chain) ===== -->
  <path d="M 175 500 C 260 470, 300 430, 360 400 S 520 330, 640 300 S 830 230, 900 190"
        fill="none" stroke="url(#trail)" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="2 16" filter="url(#lineGlow)"/>
  <path d="M 175 500 C 260 470, 300 430, 360 400 S 520 330, 640 300 S 830 230, 900 190"
        fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"
        stroke-dasharray="1 18" opacity="0.7"/>

  <!-- nodes along the trail marking cascading trigger points -->
  <circle cx="360" cy="400" r="7" fill="#00E5FF"/>
  <circle cx="360" cy="400" r="20" fill="url(#cyanGlow)" filter="url(#softBlur)"/>
  <circle cx="640" cy="300" r="7" fill="#7C5CFC"/>
  <circle cx="640" cy="300" r="20" fill="url(#cyanGlow)" filter="url(#softBlur)"/>
  <circle cx="900" cy="190" r="8" fill="#FFB84D"/>
  <circle cx="900" cy="190" r="26" fill="url(#warmGlow)" filter="url(#softBlur)"/>

  <!-- ===== HAND + PHONE (bottom-left, the single trigger) ===== -->
  <g transform="translate(90,430)">
    <!-- glow burst at tap point -->
    <circle cx="85" cy="70" r="70" fill="url(#cyanGlow)" filter="url(#strongBlur)"/>
    <!-- ripple rings -->
    <circle cx="85" cy="70" r="34" fill="none" stroke="#8CF7FF" stroke-width="2" opacity="0.8"/>
    <circle cx="85" cy="70" r="50" fill="none" stroke="#8CF7FF" stroke-width="1.5" opacity="0.5"/>
    <circle cx="85" cy="70" r="66" fill="none" stroke="#8CF7FF" stroke-width="1" opacity="0.3"/>

    <!-- phone body -->
    <rect x="45" y="10" width="80" height="150" rx="16" fill="#12163A" stroke="#3A4290" stroke-width="3"/>
    <rect x="55" y="24" width="60" height="112" rx="4" fill="#050714"/>
    <!-- glowing app grid on screen representing routine icons -->
    <circle cx="70" cy="44" r="6" fill="#FFB84D"/>
    <circle cx="95" cy="44" r="6" fill="#00E5FF"/>
    <circle cx="70" cy="68" r="6" fill="#7C5CFC"/>
    <circle cx="95" cy="68" r="6" fill="#8CF7FF"/>
    <circle cx="82" cy="92" r="9" fill="#FFD08A"/>

    <!-- fingertip tapping screen -->
    <g transform="translate(60,-38)">
      <path d="M46 130 C40 100 42 70 50 55 C55 47 66 47 68 58 L70 90 L74 60 C75 50 87 50 87 61 L88 92 L91 63 C92 53 104 54 104 65 L104 95 L107 72 C108 63 119 65 119 74 L118 112 C117 128 108 140 96 146 C82 154 56 152 46 130 Z"
            fill="#F3C9A0" stroke="#0E1230" stroke-width="1.2"/>
    </g>
  </g>
</svg>
